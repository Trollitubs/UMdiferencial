<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Derivadas Paso a Paso</title>
    
    <!-- Carga de KaTeX desde CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Plataforma de Cálculo Simbólico</h1>
            <p>Resuelve derivadas algebraicas y trigonométricas paso a paso</p>
        </header>

        <section class="calculator-card">
            <div class="form-group">
                <label for="math-input">Ingresa la función f(x):</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="math-input" 
                        placeholder="Ejemplo: (sin(3x^2))^(1/2)  ó  5x^2 / sin(x)"
                        autocomplete="off"
                    >
                    <button id="solve-btn">Calcular Paso a Paso</button>
                </div>
            </div>

            <!-- Caja de Previsualización en Tiempo Real -->
            <div class="preview-box">
                <span class="preview-label">Vista previa en tiempo real:</span>
                <div id="math-preview" class="math-display">\text{Escribe una función arriba...}</div>
            </div>
        </section>

        <!-- Contenedor para mostrar los pasos devueltos por el backend -->
        <section id="results-section" class="results-container hidden">
            <h2>Resolución Paso a Paso</h2>
            <div id="steps-list"></div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
